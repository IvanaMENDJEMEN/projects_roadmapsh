<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="convertisseur">
        <h1>Convertisseur de devise</h1>
    
        <form class="container-devise">
            <div class="block-devise">
                <label for="devise-start">Devise Source</label>
                <select name="devise-start" id="devise-start" title="Devise source">
                    <option value="">Choisir une devise...</option>
                    <option value="EUR">EUR</option>
                    <option value="USD">USD</option>
                    <option value="XAF">XAF</option>
                    <option value="CAD">CAD</option>
                    <option value="XOF">XOF</option>
                </select><br>
                <input type="number" id="montant" placeholder="Montant">             
            </div>

            <div class="block-devise">
                <label for="devise-end">Devise Cible</label>
                <select name="devise-end" id="devise-end" title="Devise Cible">
                    <option value="">Choisir une devise...</option>
                    <option value="EUR">EUR</option>
                    <option value="USD">USD</option>
                    <option value="XAF">XAF</option>
                    <option value="CAD">CAD</option>
                    <option value="XOF">XOF</option>
                </select>
                <input type="number" id="resultat-conversion" placeholder="Montant Converti" disabled>             
            </div>
        </form>
        <button id="convertbtn" type="button">Convertir</button>
        <p id="taux-echange"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
