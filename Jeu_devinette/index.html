<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Devinette</title>
</head>
<body>
    <img src="/Jeu_devinette/images/groupe-de-trois-amis-afro-americains-jouant-a-des-jeux-de-table.jpg" alt="">
    <div id="jeu-devinette">
        <h1>Jeu de Devinette</h1>
        <p>Devinez le nombre entre 1 et 100 !</p>
        <input type="number" id="guess-input" placeholder="Entrez votre nombre">

        <p id="result-message"></p>
        <button id="reset-btn">Réinitialiser le jeu</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
