<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link href="style.css" rel="stylesheet" type="text/css"/>

  <title> calculator </title>

</head>
<body>
    <!-- Quelques ameliorations a faire :
    - On ne peut pas saisir deux fois zero (00)
    - On ne peut pas saisir deux fois un point (0.0)
    - On ne peut pas saisir deux fois un plus (+)
    - On ne peut pas saisir deux fois un moins (-)
    - On ne peut pas saisir deux fois un fois (*)
    - On ne peut pas saisir deux fois un divisé (/)
    - On ne peut pas saisir succesivement 2 opérateurs, 2 points, 2 chiffres
    - On ne peut pas saisir un point après un opérateur
    - On ne peut pas saisir un opérateur après un point
    le point n'est pas un operateur quand je fais ça 000.0 j'ai "Erreur de calcul"
    -->
    <div class="calculator">
        <input type="text" id="screen" readonly placeholder="Veuillez entrer vos operations" />
        <div class="keys">
            <button type="button" onclick="ClearDisplay()">C</button>
            <button type="button" onclick="appendValue(this)">(</button>
            <button type="button" onclick="appendValue(this)">)</button>
            <button type="button" onclick="appendValue(this)">/</button>

            <button type="button" onclick="appendValue(this)">1</button>
            <button type="button" onclick="appendValue(this)">2</button>
            <button type="button" onclick="appendValue(this)">3</button>
            <button type="button" onclick="appendValue(this)">*</button>

            <button type="button" onclick="appendValue(this)">4</button>
            <button type="button" onclick="appendValue(this)">5</button>
            <button type="button" onclick="appendValue(this)">6</button>
            <button type="button" onclick="appendValue(this)">-</button>

            <button type="button" onclick="appendValue(this)">7</button>
            <button type="button" onclick="appendValue(this)">8</button>
            <button type="button" onclick="appendValue(this)">9</button>
            <button type="button" onclick="appendValue(this)">+</button>

            <button type="button" onclick="appendValue(this)">0</button>
            <button type="button" onclick="appendValue(this)">.</button>
            <button type="button" onclick="deleteLast(this)">←</button>
            <button type="button" onclick="calculateResult(this)">=</button>
        </div>
    </div>



    <script src="app.js"></script>
</body>
</html>
